<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
  <title id="t">FlyBatch determinism matrix: 19 of 19 golden requests on every filled row</title>
  <desc id="d">Nine rows of the determinism matrix, SRS Section 8.3. Rows 1 to 3b are x86-64 with the Python reference, native IEEE, SoftFloat 3e and SoftFloat 2c; rows 4 and 5 are Linux s390x under QEMU with SoftFloat 3e and native IEEE; rows 6 and 7 are MVS 3.8j under Hercules with SoftFloat 2c built by GCCMVS and by JCC. Each of these rows reproduces all 19 golden fingerprints. Row 8, z/OS, is empty because the project has no IBM Z access.</desc>
