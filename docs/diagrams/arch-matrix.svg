    .th { font-size: 12.5px; font-weight: 700; fill: #52606d; }
    .t { font-size: 13.5px; }
    .r { font-size: 13.5px; font-weight: 700; }
    .card { fill: #ffffff; stroke: #cbd2d9; }
    .x86 { fill: #eff6ff; } .s390 { fill: #f0fdfa; } .mvs { fill: #fffbeb; } .zos { fill: #f8fafc; }
    .on  { fill: #15803d; }
    .off { fill: #ffffff; stroke: #9aa5b1; stroke-dasharray: 3 2; }
  </style>
