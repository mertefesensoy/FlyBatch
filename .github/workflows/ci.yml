# ONFLY continuous integration: P-41 slice F, step F6 (SRS D-579, D-586).
#
# What a green run means (D-586, VL-142): the checks that need no network
# file pass on a GitHub-hosted x86-64 runner with the compilers that runner
# provides, and since D-663 the `golden` job reproduces the 19 golden
# fingerprints there from the networks a release publishes (P-41 G5).
# Those are not the recorded toolchains, so a green run is a smoke test and
# never evidence for the determinism matrix of SRS 8.3.  Since D-693 a
# seventh job, `no2c-linux`, runs the engine without SoftFloat 2c.
#
# Supply chain (P-41 F6): every action is pinned to a full commit SHA, with
# its release tag in a comment; the token is read-only; checkout keeps no
# credentials; no secrets are used; pull_request, never
# pull_request_target.  Dependabot proposes SHA updates (dependabot.yml).

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The committed guard (D-503, D-507) over the whole tree, Office files
  # member by member, and every commit message the push or pull request
  # adds.  It prints paths, lines and counts only, never matched text,
  # because these logs are public.
  name-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Interpreter
        run: python -VV
      - name: Guard self-test and tree
        run: |
          python tools/lint_name.py --self-test
          python tools/lint_name.py --tree
      - name: Commit messages in the pushed range
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -u
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT" = pull_request ]; then
            range="$BASE..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "$zero" ] &&
               git cat-file -e "$BEFORE^{commit}" 2>/dev/null &&
               git merge-base --is-ancestor "$BEFORE" "$HEAD_SHA"; then
            range="$BEFORE..$HEAD_SHA"
          else
            # A new branch (all-zero before) or a forced push: every
            # commit the default branch does not already have.
            range="origin/main..$HEAD_SHA"
          fi
          echo "range: $range"
          n=0
          bad=0
          for c in $(git rev-list "$range"); do
            git log -1 --format=%B "$c" > "$RUNNER_TEMP/msg.txt"
            n=$((n + 1))
            if ! python tools/lint_name.py --message "$RUNNER_TEMP/msg.txt"; then
              echo "finding in the message of $c"
              bad=$((bad + 1))
            fi
          done
          echo "name-guard: $n commit messages checked, $bad with findings"
          test "$bad" -eq 0

  # Python checks on a bare checkout: no network, no build, and no package
  # beyond the standard library.  Not strict: the point is that every file
  # ends in a pass or a counted onfres skip, never in an ImportError
  # (D-591).  tests/test_strm.py takes a built engine and runs only in
  # `make test` (D-592).
  python-bare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Interpreter, and proof that it is bare
        run: |
          python -VV
          python -m pip freeze
          python -c "import importlib.util as u, sys; p = [m for m in ('numpy', 'pandas', 'pyarrow') if u.find_spec(m)]; print('third-party packages present:', p); sys.exit(1 if p else 0)"
      - name: Licence and notices checks
        run: |
          python tools/lint_lic.py
          python tools/lint_ntc.py --self-test
          python tools/lint_ntc.py
      - name: The 14 build-free Python test files
        run: |
          set -u
          fail=0
          for t in bias c04 chunk disc fixt gain geom netman seeds signs trust txcmp varnt; do
            echo "== tests/test_$t.py"
            python "tests/test_$t.py" || { echo "FAILED: tests/test_$t.py"; fail=1; }
          done
          echo "== tests/test_onfres.py"
          python tests/test_onfres.py make || { echo "FAILED: tests/test_onfres.py"; fail=1; }
          exit $fail

  # `make test-nonet` on Linux x86-64 (ONFPLAT=x86l, D-550), strict.
  nonet-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Toolchain
        run: |
          gcc -v
          make --version | head -1
          python -VV
      - name: Pinned packages
        run: |
          python -m pip install -r requirements.txt
          python -m pip freeze
      - name: make test-nonet, strict
        env:
          ONFLY_NOSKIP: "1"
        run: make ONFPLAT=x86l PYTHON=python test-nonet

  # P-52, D-693: `make NO2C=1 test-nonet` on Linux x86-64, strict.  NO2C=1
  # builds and compares the engine on SOFT3E and NATIVE only and never
  # compiles SoftFloat 2c (D-690); each 2c half left out prints a counted
  # ONFRES NO2C marker (D-691).  The closing line is pinned, so a target
  # that loses its marker or gains one fails here.  Then the 2c sources are
  # deleted and the eight NONET targets that reach 2c run again, to show
  # they need no 2c file.  A smoke test on GitHub's gcc, never Section 8.3
  # evidence (D-586, VL-142).
  no2c-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Toolchain
        run: |
          gcc -v
          make --version | head -1
          python -VV
      - name: Pinned packages
        run: |
          python -m pip install -r requirements.txt
          python -m pip freeze
      - name: make NO2C=1 test-nonet, strict, closing line pinned
        env:
          ONFLY_NOSKIP: "1"
        run: |
          set -o pipefail
          make ONFPLAT=x86l PYTHON=python NO2C=1 test-nonet 2>&1 \
            | tee "$RUNNER_TEMP/no2c.log"
          last=$(tail -1 "$RUNNER_TEMP/no2c.log")
          want="ONFLY test NO2C=1: 16 PASS, 0 SKIP, 0 PENDING, 2 EXEMPT, 7 NO2C ("
          case "$last" in
            "$want"*) echo "closing line as pinned" ;;
            *) echo "unexpected closing line: $last"; exit 1 ;;
          esac
          if find build | grep -E '_2c\.exe|obj2c|onflyeng2[lmv]?\.o|tst2c|tstc2c'; then
            echo "a SoftFloat 2c object was built under NO2C=1"
            exit 1
          fi
      - name: The eight engine targets again, with no SoftFloat 2c file present
        env:
          ONFLY_NOSKIP: "1"
          NO2C: "1"
          ONFPLAT: x86l
        run: |
          set -o pipefail
          rm -rf third_party/SoftFloat-2c softfloat/c2c build
          test ! -e third_party/SoftFloat-2c
          test ! -e softfloat/c2c
          python tools/testrun.py make c04mvs tt02 c2c shim fp kernel syn eng \
            2>&1 | tee "$RUNNER_TEMP/no2c-bare.log"
          last=$(tail -1 "$RUNNER_TEMP/no2c-bare.log")
          want="ONFLY test NO2C=1: 1 PASS, 0 SKIP, 0 PENDING, 0 EXEMPT, 7 NO2C ("
          case "$last" in
            "$want"*) echo "closing line as pinned" ;;
            *) echo "unexpected closing line: $last"; exit 1 ;;
          esac

  # D-678: the dev container, proven rather than assumed.  The same image,
  # pinned by the same digest as .devcontainer/devcontainer.json, runs the
  # same .devcontainer/setup.sh a Codespace runs (packages, then the
  # networks from NETWORKS_TAG below), then `make test-nonet`, strict.  If
  # the two digests ever differ, this job no longer tests the container
  # newcomers get.  A smoke test on the image's gcc, never Section 8.3
  # evidence (D-586, VL-142).
  devcontainer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/devcontainers/python:3.13-trixie@sha256:5ea7e72d3c1beb6aefdfea8001483345c39af4898e22f2c543deb6a00802ede4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          gcc -v
          make --version | head -1
          python -VV
      - name: The dev container's setup script
        run: sh .devcontainer/setup.sh
      - name: make test-nonet, strict
        env:
          ONFLY_NOSKIP: "1"
        run: make ONFPLAT=x86l PYTHON=python test-nonet

  # P-41 G5 (SRS D-663, D-667): the 19 golden fingerprints on every push.
  # The two networks come from one pinned release tag, moved by this one
  # line at each release, and are checked against its SHA256SUMS before any
  # test; then `make quick` builds the engine and compares all 19 requests.
  # .devcontainer/setup.sh reads the same line (D-678).
  # Still a smoke test on GitHub's gcc, a new data point and never Section
  # 8.3 evidence (D-586, VL-142).
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NETWORKS_TAG: v0.5.1-rc.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Toolchain
        run: |
          gcc -v
          make --version | head -1
          python -VV
      - name: Pinned packages
        run: |
          python -m pip install -r requirements.txt
          python -m pip freeze
      - name: Fetch and check the networks
        run: |
          nets="$RUNNER_TEMP/nets"
          mkdir -p "$nets"
          R="https://github.com/mertefesensoy/FlyBatch/releases/download/$NETWORKS_TAG"
          for f in onfnet-malecns-v1.0-srext.bin onfnet-malecns-v1.0-path.bin SHA256SUMS NETWORKS-NOTICE.md; do
            curl -fsSL -o "$nets/$f" "$R/$f"
          done
          (cd "$nets" && sha256sum -c SHA256SUMS)
          python tools/fixtures.py --from "$nets"
          python tools/fixtures.py --check
      - name: make quick, strict
        env:
          ONFLY_NOSKIP: "1"
        run: make ONFPLAT=x86l PYTHON=python quick

  # `mingw32-make test-nonet` under MSYS2's 32-bit MinGW, strict.  It shares
  # x86w's ONFPLAT value with the recorded Windows host, not its compiler:
  # MinGW.org gcc 6.3.0 is recorded, MSYS2's mingw-w64 gcc runs here.
  nonet-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884  # v2.32.0
        with:
          msystem: MINGW32
          path-type: inherit
          update: false
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-make
      - name: Toolchain
        run: |
          which gcc mingw32-make python
          gcc -v
          mingw32-make --version | head -1
          python -VV
      - name: Pinned packages
        run: |
          python -m pip install -r requirements.txt
          python -m pip freeze
      - name: TestFloat generator
        run: mingw32-make testfloat
      - name: mingw32-make test-nonet, strict
        env:
          ONFLY_NOSKIP: "1"
        run: mingw32-make test-nonet
