<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- FlyBatch's favicon (SRS D-657): a red-eyed fruit fly on a stack of
       80-column punched cards, the fly as a batch job.  Hand-drawn; no
       outside imagery.  Each card is 50 by 36 with its top-left corner cut. -->
  <defs>
    <path id="card" d="M6 0 H50 V36 H0 V6 Z"/>
  </defs>
  <g stroke-width="1.6" stroke-linejoin="round">
    <use href="#card" x="12" y="6" fill="#e2d3a6" stroke="#9a8445"/>
    <use href="#card" x="8" y="11" fill="#ebdcb3" stroke="#a08a4a"/>
    <use href="#card" x="3" y="17" fill="#f3e7c4" stroke="#a8914f"/>
  </g>
  <!-- Punched holes on the front card, kept clear of the fly. -->
  <g fill="#3b3f4a">
    <rect x="7" y="27" width="2.4" height="4.4" rx="0.4"/>
    <rect x="7" y="37" width="2.4" height="4.4" rx="0.4"/>
    <rect x="12" y="45" width="2.4" height="4.4" rx="0.4"/>
    <rect x="44" y="21" width="2.4" height="4.4" rx="0.4"/>
    <rect x="47" y="31" width="2.4" height="4.4" rx="0.4"/>
    <rect x="47" y="44" width="2.4" height="4.4" rx="0.4"/>
  </g>
  <!-- The fly, seen from above: wings, striped abdomen, thorax, head and
       the red eyes that make Drosophila recognisable at 16 px. -->
  <g transform="translate(28 36) rotate(-18) scale(0.98)">
    <ellipse cx="-7" cy="3" rx="5.5" ry="11" transform="rotate(24 -7 3)" fill="#e6edf8" fill-opacity="0.92" stroke="#8a96ad" stroke-width="1"/>
    <ellipse cx="7" cy="3" rx="5.5" ry="11" transform="rotate(-24 7 3)" fill="#e6edf8" fill-opacity="0.92" stroke="#8a96ad" stroke-width="1"/>
    <ellipse cx="0" cy="7" rx="4.6" ry="7.5" fill="#c08a3e"/>
    <path d="M-4.2 6 H4.2 M-4.4 9.5 H4.4" stroke="#6b4a1c" stroke-width="1.3"/>
    <ellipse cx="0" cy="-3.5" rx="5" ry="4.6" fill="#9a6b2c"/>
    <circle cx="0" cy="-9.5" r="3.6" fill="#9a6b2c"/>
    <circle cx="-3" cy="-10.2" r="2.5" fill="#e0262b"/>
    <circle cx="3" cy="-10.2" r="2.5" fill="#e0262b"/>
  </g>
</svg>
